<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090909"><title>SATTA KING | Demo Redeem Requests</title><link rel="stylesheet" href="/style.css"><style>
body{background:#090909;color:#f4ead2}.wrap{max-width:850px;margin:20px auto;padding:0 13px 50px}.panel{border:1px solid #765c2c;border-radius:14px;background:linear-gradient(145deg,#20190f,#101010 70%);padding:14px;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.head h1{font-size:21px;color:#f4d58b;margin:0}.muted{font-size:12px;color:#c8b995;line-height:1.5}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,select{border:1px solid #d6ad55;border-radius:9px;padding:9px 12px;background:#241b0d;color:#f4d58b;font-weight:800}button.primary{background:linear-gradient(135deg,#f4d58b,#bd8b35);color:#211707}button.danger{border-color:#9a4545;color:#ffb5b5}button:disabled{opacity:.5}.list{display:grid;gap:9px}.item{border:1px solid #42351f;border-radius:10px;background:#111;padding:12px;display:grid;gap:8px}.item strong{color:#f4d58b}.item small{display:block;color:#aaa;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:11px;font-weight:900;padding:5px 8px;border-radius:20px;background:#3a3424;color:#ffe2a0}.status.approved{background:#173b27;color:#a6efbd}.status.rejected{background:#3a2020;color:#ffb5b5}.empty{text-align:center;color:#aaa;padding:20px}.msg{color:#f3d58e;min-height:20px;font-size:13px}
</style></head><body><header class="user-dashboard-header"><div class="brand">👑 SATTA KING 👑</div><p>ADMIN · VIRTUAL DEMO POINTS</p></header><main class="wrap"><section class="panel"><div class="head"><h1>🎁 Demo Points Redeem Requests</h1><a href="/admin" style="color:#f4d58b">← Admin Panel</a></div><p class="muted">यह केवल Virtual Demo Points का Fun Request सिस्टम है। Approve करने पर User के Demo Wallet से Points घटेंगे और Wallet Transaction बनेगा। कोई Real Money या Payment नहीं है।</p><div class="tools"><select id="filter"><option value="PENDING">Pending Requests</option><option value="ALL">सभी Requests</option><option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option></select><button id="reload" type="button">↻ Refresh</button></div><p id="msg" class="msg" role="status"></p></section><section class="panel"><div id="list" class="list"><p class="empty">Requests लोड हो रही हैं…</p></div></section></main><script>
(()=>{"use strict";const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString("en-IN"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(path,opts={}){const r=await fetch(path,{...opts,credentials:"same-origin",headers:{"Content-Type":"application/json",...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed");return d;}
async function load(){ $("msg").textContent="";$("list").innerHTML='<p class="empty">लोड हो रहा है…</p>';try{const d=await api("/api/admin/demo-redeem-requests?status="+encodeURIComponent($("filter").value));const rows=d.requests||[];$("list").innerHTML=rows.length?rows.map(x=>{const p=x.playerId||{},st=x.status;return '<article class="item"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><strong>'+esc(p.name||"Demo User")+' · '+esc(p.mobile||"")+'</strong><span class="status '+st.toLowerCase()+'">'+st+'</span></div><div><strong>'+fmt(x.points)+' Virtual Demo Points</strong><small>Available Balance: '+fmt(p.walletPoints)+' Points<br>Request: '+new Date(x.createdAt).toLocaleString("hi-IN")+(x.reviewedAt?'<br>Reviewed: '+new Date(x.reviewedAt).toLocaleString("hi-IN"):"")+(x.adminNote?'<br>Note: '+esc(x.adminNote):"")+'</small></div>'+(st==="PENDING"?'<div class="actions"><button class="primary" data-action="APPROVE" data-id="'+esc(x._id)+'">✓ Approve</button><button class="danger" data-action="REJECT" data-id="'+esc(x._id)+'">✕ Reject</button></div>':"")+'</article>';}).join(""):'<p class="empty">इस Filter में कोई Request नहीं है।</p>';}catch(e){$("list").innerHTML='<p class="empty">'+esc(e.message)+'</p>';}}
$("filter").addEventListener("change",load);$("reload").addEventListener("click",load);$("list").addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(!b)return;const action=b.dataset.action,id=b.dataset.id;if(action==="APPROVE"&&!confirm("इस User के Demo Wallet से Requested Points घटाकर Request Approve करें?"))return;if(action==="REJECT"&&!confirm("यह Redeem Request Reject करें?"))return;b.disabled=true;try{await api("/api/admin/demo-redeem-requests/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({action})});$("msg").textContent=action==="APPROVE"?"Request Approved और Demo Points Wallet से घटा दिए गए।":"Request Reject कर दी गई।";await load();}catch(err){$("msg").textContent=err.message;b.disabled=false;}});load();})();
</script></body></html>
