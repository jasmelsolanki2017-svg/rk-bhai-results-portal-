<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#101827">
<title>RK Bhai Admin Login</title>
<link rel="stylesheet" href="/style.css">
<style>
html,body{min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:#f3f6fb}
.login-wrap{width:min(100%,420px)}
.login-brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px;text-align:left}
.login-brand .brand-mark{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;font-weight:900;font-size:21px;background:#17243b;color:#fff}
.login-brand .brand{font-size:23px;font-weight:900;letter-spacing:1px}
.login-brand .brand span{color:#2463eb}
.login-brand p{margin:3px 0 0;font-size:10px;letter-spacing:2px;color:#667085}
.login-card{padding:26px;border-radius:18px;background:#fff;box-shadow:0 16px 45px #17243b14;border:1px solid #e5eaf2}
.login-card h1{margin:0 0 6px;font-size:23px}
.login-card p{margin:0 0 20px;color:#667085}
.login-card form{display:grid;gap:13px}
.login-card input{width:100%;box-sizing:border-box;min-height:48px;padding:12px 14px;border:1px solid #d8deea;border-radius:10px;font:inherit}
.login-card button{min-height:48px;border:0;border-radius:10px;background:#1e5bd7;color:#fff;font-weight:700;font-size:16px}
#loginMsg{min-height:22px;margin:12px 0 0;color:#b42318;font-size:14px}
</style>
</head>
<body>
<main class="login-wrap">
<div class="login-brand"><div class="brand-mark">RK</div><div><div class="brand">RK <span>BHAI</span></div><p>ADMIN LOGIN</p></div></div>
<section class="login-card">
<h1>Admin Login</h1>
<p>आगे बढ़ने के लिए अपनी Login ID और Password डालें।</p>
<form id="adminLoginForm">
<input name="username" type="text" autocomplete="username" placeholder="Login ID" aria-label="Login ID" required>
<input name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
<button type="submit">Login करें</button>
</form>
<p id="loginMsg" role="status" aria-live="polite"></p>
</section>
</main>
<script src="/admin-login.js"></script>
</body>
</html>
