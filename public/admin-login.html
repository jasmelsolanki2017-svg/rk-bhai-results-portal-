<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#090909">
<title>Satta King Admin Login</title>
<link rel="stylesheet" href="/style.css?v=20261121admin-logo-fix1">
<style>
html,body{min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:radial-gradient(circle at top,#292012 0,#090909 55%);color:#f7f3ea}
.login-wrap{width:min(100%,420px)}
.login-brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px;text-align:left}
.login-brand .brand-mark{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;font-weight:900;font-size:21px;background:linear-gradient(145deg,#493719,#21190e);color:#f4d58b;border:1px solid #80632d}
.login-brand .brand{font-size:23px;font-weight:900;letter-spacing:1px;color:#d7ad55}
.login-brand .brand span{color:#fff}
.login-brand p{margin:3px 0 0;font-size:10px;letter-spacing:2px;color:#aaa}
.login-card{padding:26px;border-radius:18px;background:linear-gradient(145deg,#191919,#101010);box-shadow:0 16px 45px #0009;border:1px solid #59451f}
.login-card h1{margin:0 0 6px;font-size:23px;color:#f4d58b}
.login-card p{margin:0 0 20px;color:#aaa;line-height:1.5}
.login-card form{display:grid;gap:13px}
.login-card input{width:100%;box-sizing:border-box;min-height:48px;padding:12px 14px;border:1px solid #59451f;border-radius:10px;background:#090909;color:#fff;font:inherit;outline:none}
.login-card input:focus{border-color:#d7ad55;box-shadow:0 0 0 3px #d7ad5525}
.login-card input::placeholder{color:#888}
.login-card button{min-height:48px;border:1px solid #80632d;border-radius:10px;background:linear-gradient(145deg,#493719,#2a2112);color:#ffe5a5;font-weight:800;font-size:16px;cursor:pointer}
.login-card button:hover{border-color:#e0b85e;background:#59431f}
#loginMsg{min-height:22px;margin:12px 0 0;color:#ff8b8b;font-size:14px}
@media(max-width:480px){.login-card{padding:22px 18px}.login-brand{margin-bottom:18px}}
</style>
</head>
<body>
<main class="login-wrap">
<div class="login-brand"><div class="brand-mark"><img src="/brand-crown.svg" alt="" aria-hidden="true"></div><div><div class="brand">👑 Satta king 👑</div><p>ADMIN LOGIN</p></div></div>
<section class="login-card">
<h1>Admin Login</h1>
<p>आगे बढ़ने के लिए अपनी Login ID और Password डालें।</p>
<form id="adminLoginForm">
<input name="username" type="text" autocomplete="username" placeholder="Login ID" aria-label="Login ID" required>
<input name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
<button type="submit">Login करें</button>
</form>
<p id="loginMsg" role="status" aria-live="polite"></p>
</section>
</main>
<script src="/admin-login.js?v=20261121ads-return-path1"></script>
<script src="/refresh-button.js?v=20261117refresh1"></script>
</body>
</html>
