<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>City Records | RK Bhai Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="brand">RK <span>BHAI</span></div><p>PRIVATE CITY RECORDS</p></header><main><section class="admin-box"><div class="admin-top"><div><h1 id="cityTitle" style="color:var(--gold);margin:0">City Records</h1><p id="cityCount" class="muted"></p></div><a class="back-link" href="/admin">← Admin Panel</a></div><div id="cityLoginMsg" class="muted">Admin session जाँची जा रही है…</div><div class="city-month-nav"><button type="button" id="prevMonth" class="secondary">← पिछला</button><div class="city-month-select"><label for="monthPicker">महीना चुनें</label><select id="monthPicker"></select><strong id="activeMonthLabel"></strong></div><button type="button" id="nextMonth" class="secondary">अगला →</button></div><div id="cityRecords"></div></section><section id="cityEditBox" class="admin-box" hidden><h2>रिकॉर्ड एडिट करें</h2><form id="cityEditForm"><input name="id" type="hidden"><label>शहर / मार्केट</label><input name="title" required maxlength="100"><label>परिणाम</label><input name="resultText" required maxlength="300"><label>तारीख</label><input name="resultDate" type="date" required><label>सोर्स लिंक (वैकल्पिक)</label><input name="sourceUrl" type="url"><label class="check"><input name="published" type="checkbox"> प्रकाशित करें</label><div class="form-actions"><button type="submit">बदलाव सेव करें</button><button type="button" class="secondary" id="cancelCityEdit">रद्द करें</button></div></form></section></main><script src="/city.js"></script></body></html>
