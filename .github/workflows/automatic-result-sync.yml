name: Automatic Result Sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/auto-sync-results.js'
      - 'scripts/build-ai-parser-report.js'
      - '.github/workflows/automatic-result-sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: automatic-result-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate sync script syntax
        run: |
          node --check scripts/auto-sync-results.js
          node --check scripts/build-ai-parser-report.js

  sync:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --omit=dev
      - name: Fetch and publish new results
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COARENA_API_KEY: ${{ secrets.COARENA_API_KEY }}
        run: node scripts/auto-sync-results.js
      - name: Publish separate AI and Parser comparison report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-ai-parser-report.js
